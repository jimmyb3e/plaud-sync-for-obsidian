name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "npm"

            - run: npm ci
            - run: npm run build

            - name: Verify release tag matches manifest version
              run: node -e "const manifest = require('./manifest.json'); const tag = process.env.GITHUB_REF_NAME; if (manifest.version !== tag) { throw new Error('Tag ' + tag + ' does not match manifest version ' + manifest.version); }"

            - name: Generate artifact attestations
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG" \
                      --title "$TAG" \
                      --generate-notes \
                      main.js manifest.json styles.css
